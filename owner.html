<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Property - Global Estates</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="site-header">
  <div class="container nav-container">
    <a href="/" class="logo">Global Estates</a>

    <button class="menu-btn" type="button">☰</button>

    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/owner.html">List Property</a>
    </nav>
  </div>
</header>

<main class="container section">

  <div class="section-heading">
    <h1>List Your Property</h1>
    <p>Enter your property details and continue securely to Paystack.</p>
  </div>

  <div class="card">

    <form id="propertyForm">

      <div class="form-group">
        <label for="title">Property Title</label>
        <input id="title" type="text" required
          placeholder="e.g. Modern 3 Bedroom House">
      </div>

      <div class="form-group">
        <label for="location">Location</label>
        <input id="location" type="text" required
          placeholder="e.g. Nairobi">
      </div>

      <div class="form-group">
        <label for="country">Country</label>
        <input id="country" type="text" required
          placeholder="e.g. Kenya">
      </div>

      <div class="form-group">
        <label for="propertyType">Property Type</label>
        <select id="propertyType" required>
          <option value="">Select property type</option>
          <option>House</option>
          <option>Apartment</option>
          <option>Villa</option>
          <option>Land</option>
          <option>Hotel</option>
          <option>Vacation Home</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="purpose">Purpose</label>
        <select id="purpose" required>
          <option value="">Select purpose</option>
          <option>For Rent</option>
          <option>For Sale</option>
          <option>Vacation</option>
          <option>Outing</option>
        </select>
      </div>

      <div class="form-group">
        <label for="price">Property Price</label>
        <input id="price" type="number" min="0" required
          placeholder="Enter property price">
      </div>

      <div class="form-group">
        <label for="currency">Currency</label>
        <select id="currency">
          <option value="KES">KES - Kenyan Shilling</option>
          <option value="USD">USD - US Dollar</option>
          <option value="EUR">EUR - Euro</option>
          <option value="GBP">GBP - British Pound</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" rows="5" required
          placeholder="Describe your property"></textarea>
      </div>

      <h2>Owner Information</h2>

      <div class="form-group">
        <label for="ownerName">Your Name</label>
        <input id="ownerName" type="text" required>
      </div>

      <div class="form-group">
        <label for="ownerEmail">Email</label>
        <input id="ownerEmail" type="email" required
          placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="ownerPhone">Phone / WhatsApp</label>
        <input id="ownerPhone" type="tel" required>
      </div>

      <div class="form-group">
        <label for="plan">Listing Plan</label>

        <select id="plan" required>
          <option value="Featured" data-amount="1000">
            Featured - KES 1,000
          </option>

          <option value="Premium" data-amount="2500">
            Premium - KES 2,500
          </option>
        </select>
      </div>

      <button
        id="continueButton"
        type="submit"
        class="btn btn-primary">
        Continue to Paystack
      </button>

    </form>

    <div id="propertyMessage"></div>

  </div>

</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 Global Estates. All rights reserved.</p>
  </div>
</footer>


<script>

document.addEventListener("DOMContentLoaded", function () {

  const form = document.getElementById("propertyForm");
  const button = document.getElementById("continueButton");
  const message = document.getElementById("propertyMessage");

  form.addEventListener("submit", async function (event) {

    event.preventDefault();

    button.disabled = true;
    button.textContent = "Saving property...";

    const planSelect = document.getElementById("plan");
    const selectedPlan =
      planSelect.options[planSelect.selectedIndex];

    const amount =
      Number(selectedPlan.dataset.amount);

    const property = {

      title:
        document.getElementById("title").value.trim(),

      location:
        document.getElementById("location").value.trim(),

      country:
        document.getElementById("country").value.trim(),

      propertyType:
        document.getElementById("propertyType").value,

      purpose:
        document.getElementById("purpose").value,

      price:
        document.getElementById("price").value,

      currency:
        document.getElementById("currency").value,

      description:
        document.getElementById("description").value.trim(),

      ownerName:
        document.getElementById("ownerName").value.trim(),

      ownerEmail:
        document.getElementById("ownerEmail").value.trim(),

      ownerPhone:
        document.getElementById("ownerPhone").value.trim(),

      plan:
        selectedPlan.value,

      listingFee:
        amount,

      savedAt:
        new Date().toISOString()

    };


    /* Save property on the client's device */

    localStorage.setItem(
      "globalEstatesProperty",
      JSON.stringify(property)
    );


    message.innerHTML =
      '<div class="alert alert-success">' +
      'Property saved. Opening secure payment...' +
      '</div>';


    button.textContent =
      "Opening Paystack...";


    try {

      const response = await fetch(
        "/api/paystack/initialize",
        {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            email: property.ownerEmail,

            amount: amount,

            metadata: {

              plan: property.plan,

              listingFee: amount,

              propertyTitle:
                property.title,

              propertyLocation:
                property.location,

              country:
                property.country,

              propertyType:
                property.propertyType,

              purpose:
                property.purpose,

              propertyPrice:
                property.price,

              currency:
                property.currency,

              description:
                property.description,

              ownerName:
                property.ownerName,

              ownerPhone:
                property.ownerPhone,

              source:
                "Global Estates"

            }

          })

        }
      );


      const data =
        await response.json();


      if (!response.ok || !data.status) {

        throw new Error(
          data.error ||
          "Paystack could not start the payment."
        );

      }


      if (!data.authorization_url) {

        throw new Error(
          "Paystack checkout URL was not returned."
        );

      }


      /* Send client directly to Paystack */

      window.location.href =
        data.authorization_url;


    } catch (error) {

      console.error(
        "Paystack error:",
        error
      );

      message.innerHTML =
        '<div class="alert alert-error">' +
        'Payment could not be started: ' +
        error.message +
        '</div>';

      button.disabled = false;

      button.textContent =
        "Continue to Paystack";

    }

  });

});

</script>

</body>
</html>
