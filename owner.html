<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Your Property | Global Estates</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07110d;
      color: #ffffff;
    }

    .header {
      padding: 20px;
      background: #0b1913;
      border-bottom: 1px solid #244535;
    }

    .header h1 {
      margin: 0;
      color: #d6b35a;
      font-size: 25px;
    }

    .header p {
      margin: 6px 0 0;
      color: #b9c8c0;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: #0d1d16;
      border: 1px solid #294c3a;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #416151;
      background: #08130e;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .plans {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    .plan {
      border: 1px solid #416151;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      background: #091710;
    }

    .plan:hover {
      border-color: #d6b35a;
    }

    .plan input {
      width: auto;
      margin-right: 8px;
    }

    .plan strong {
      color: #d6b35a;
    }

    .pay-button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #d6b35a;
      color: #07110d;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay-button:hover {
      opacity: .9;
    }

    .pay-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      background: #321515;
      color: #ffb5b5;
      line-height: 1.5;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #d6b35a;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Global Estates</h1>
    <p>List your property</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>Property Details</h2>

      <form id="propertyForm">

        <label for="title">Property Title</label>
        <input
          id="title"
          name="title"
          type="text"
          placeholder="e.g. Modern 3 Bedroom House"
          required
        >

        <label for="location">Location</label>
        <input
          id="location"
          name="location"
          type="text"
          placeholder="e.g. Nairobi, Kenya"
          required
        >

        <label for="country">Country</label>
        <input
          id="country"
          name="country"
          type="text"
          placeholder="e.g. Kenya"
          required
        >

        <label for="propertyType">Property Type</label>
        <select id="propertyType" name="propertyType" required>
          <option value="">Select type</option>
          <option value="House">House</option>
          <option value="Apartment">Apartment</option>
          <option value="Villa">Villa</option>
          <option value="Land">Land</option>
          <option value="Commercial">Commercial Property</option>
          <option value="Vacation Stay">Vacation Stay</option>
          <option value="Other">Other</option>
        </select>

        <label for="purpose">Purpose</label>
        <select id="purpose" name="purpose" required>
          <option value="">Select purpose</option>
          <option value="Rent">Rent</option>
          <option value="Sale">Sale</option>
          <option value="Vacation">Vacation / Outing</option>
        </select>

        <label for="price">Property Price</label>
        <input
          id="price"
          name="price"
          type="number"
          min="0"
          placeholder="Enter property price"
          required
        >

        <label for="currency">Currency</label>
        <select id="currency" name="currency">
          <option value="KES">KES - Kenyan Shilling</option>
          <option value="USD">USD - US Dollar</option>
          <option value="GBP">GBP - British Pound</option>
          <option value="EUR">EUR - Euro</option>
        </select>

        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          placeholder="Describe the property..."
          required
        ></textarea>

        <label for="ownerName">Your Name</label>
        <input
          id="ownerName"
          name="ownerName"
          type="text"
          placeholder="Your full name"
          required
        >

        <label for="ownerEmail">Email</label>
        <input
          id="ownerEmail"
          name="ownerEmail"
          type="email"
          placeholder="your@email.com"
          required
        >

        <label for="ownerPhone">Phone Number</label>
        <input
          id="ownerPhone"
          name="ownerPhone"
          type="tel"
          placeholder="e.g. 0712345678"
          required
        >

        <label>Choose Listing Plan</label>

        <div class="plans">

          <label class="plan">
            <input
              type="radio"
              name="plan"
              value="featured"
              data-amount="1000"
              required
            >
            <strong>Featured — KES 1,000</strong>
            <br>
            Your property gets featured visibility.
          </label>

          <label class="plan">
            <input
              type="radio"
              name="plan"
              value="premium"
              data-amount="2500"
            >
            <strong>Premium — KES 2,500</strong>
            <br>
            Your property receives premium visibility.
          </label>

        </div>

        <button
          id="payButton"
          class="pay-button"
          type="submit"
        >
          Continue to Paystack
        </button>

        <div id="message"></div>

      </form>

      <a class="back" href="/">← Back to Global Estates</a>

    </div>

  </div>


  <script>

    const form = document.getElementById("propertyForm");
    const payButton = document.getElementById("payButton");
    const message = document.getElementById("message");


    function showMessage(text) {
      message.style.display = "block";
      message.textContent = text;
    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.style.display = "none";

      const selectedPlan =
        document.querySelector(
          'input[name="plan"]:checked'
        );

      if (!selectedPlan) {
        showMessage("Please select a listing plan.");
        return;
      }


      const amount =
        Number(selectedPlan.dataset.amount);

      if (!amount) {
        showMessage("Invalid payment amount.");
        return;
      }


      const email =
        document.getElementById("ownerEmail").value.trim();


      if (!email) {
        showMessage("Please enter your email address.");
        return;
      }


      const property = {

        title:
          document.getElementById("title").value.trim(),

        location:
          document.getElementById("location").value.trim(),

        country:
          document.getElementById("country").value.trim(),

        propertyType:
          document.getElementById("propertyType").value,

        purpose:
          document.getElementById("purpose").value,

        price:
          Number(document.getElementById("price").value),

        currency:
          document.getElementById("currency").value,

        description:
          document.getElementById("description").value.trim(),

        ownerName:
          document.getElementById("ownerName").value.trim(),

        ownerEmail:
          email,

        ownerPhone:
          document.getElementById("ownerPhone").value.trim(),

        plan:
          selectedPlan.value,

        listingFee:
          amount

      };


      try {

        payButton.disabled = true;
        payButton.textContent =
          "Connecting to Paystack...";


        /*
         * Save the property temporarily in the
         * customer's browser.
         */
        localStorage.setItem(
          "globalEstatesPendingProperty",
          JSON.stringify(property)
        );


        /*
         * Ask our Render backend to create
         * the Paystack payment.
         */
        const response = await fetch(
          "/api/paystack/initialize",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              email: email,

              amount: amount,

              metadata: {
                type: "property_listing",
                plan: selectedPlan.value,
                propertyTitle: property.title,
                ownerEmail: property.ownerEmail
              }

            })
          }
        );


        const data =
          await response.json();


        console.log(
          "Paystack initialization:",
          data
        );


        if (
          !response.ok ||
          !data.status ||
          !data.authorization_url
        ) {

          throw new Error(
            data.error ||
            data.message ||
            "Paystack could not start the payment."
          );

        }


        /*
         * This is the important part:
         * send the customer to Paystack.
         */
        window.location.href =
          data.authorization_url;


      } catch (error) {

        console.error(
          "Payment error:",
          error
        );

        showMessage(
          "Payment could not start: " +
          error.message
        );

        payButton.disabled = false;

        payButton.textContent =
          "Continue to Paystack";

      }

    });

  </script>

</body>
</html>
