<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>List Your Property | Global Estates</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07110d;
      color: #ffffff;
    }

    .header {
      padding: 20px;
      background: #0b1913;
      border-bottom: 1px solid #244535;
    }

    .header h1 {
      margin: 0;
      color: #d6b35a;
      font-size: 26px;
    }

    .header p {
      margin: 6px 0 0;
      color: #b9c8c0;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: #0d1d16;
      border: 1px solid #294c3a;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    h2 {
      margin-top: 0;
      color: #ffffff;
    }

    label.field-label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #416151;
      background: #08130e;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #d6b35a;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .plans {
      display: grid;
      gap: 14px;
      margin-top: 10px;
    }

    /*
      BIG PRESSABLE PLAN BUTTONS
    */

    .plan-button {
      width: 100%;
      padding: 20px;
      border: 2px solid #416151;
      border-radius: 14px;
      background: #091710;
      color: white;
      text-align: left;
      cursor: pointer;
      font-size: 16px;
      transition: .2s;
    }

    .plan-button:hover {
      border-color: #d6b35a;
    }

    .plan-button:active {
      transform: scale(.98);
    }

    .plan-button strong,
    .plan-button span,
    .plan-button small {
      display: block;
    }

    .plan-button strong {
      color: #d6b35a;
      font-size: 20px;
      margin-bottom: 6px;
    }

    .plan-button span {
      font-size: 18px;
      font-weight: bold;
    }

    .plan-button small {
      margin-top: 7px;
      color: #b9c8c0;
      line-height: 1.4;
    }

    /*
      SELECTED PLAN
    */

    .plan-button.selected {
      border-color: #d6b35a;
      background: #172b20;
      box-shadow: 0 0 0 2px rgba(214,179,90,.15);
    }

    .selected-label {
      display: none;
      margin-top: 10px;
      color: #d6b35a;
      font-weight: bold;
    }

    .plan-button.selected .selected-label {
      display: block;
    }

    /*
      PAYMENT BUTTON
    */

    .pay-button {
      width: 100%;
      margin-top: 25px;
      padding: 17px;
      border: none;
      border-radius: 10px;
      background: #d6b35a;
      color: #07110d;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay-button:hover {
      opacity: .9;
    }

    .pay-button:active {
      transform: scale(.99);
    }

    .pay-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      background: #321515;
      color: #ffb5b5;
      line-height: 1.5;
    }

    .success-message {
      background: #143522 !important;
      color: #b9ffd1 !important;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #d6b35a;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Global Estates</h1>
    <p>List your property</p>
  </div>


  <div class="container">

    <div class="card">

      <h2>Property Details</h2>

      <form id="propertyForm">

        <!-- PROPERTY TITLE -->

        <label class="field-label" for="title">
          Property Title
        </label>

        <input
          id="title"
          name="title"
          type="text"
          placeholder="e.g. Modern 3 Bedroom House"
          required
        >


        <!-- LOCATION -->

        <label class="field-label" for="location">
          Location
        </label>

        <input
          id="location"
          name="location"
          type="text"
          placeholder="e.g. Nairobi, Kenya"
          required
        >


        <!-- COUNTRY -->

        <label class="field-label" for="country">
          Country
        </label>

        <input
          id="country"
          name="country"
          type="text"
          placeholder="e.g. Kenya"
          required
        >


        <!-- PROPERTY TYPE -->

        <label class="field-label" for="propertyType">
          Property Type
        </label>

        <select
          id="propertyType"
          name="propertyType"
          required
        >
          <option value="">
            Select property type
          </option>

          <option value="House">
            House
          </option>

          <option value="Apartment">
            Apartment
          </option>

          <option value="Villa">
            Villa
          </option>

          <option value="Land">
            Land
          </option>

          <option value="Commercial">
            Commercial Property
          </option>

          <option value="Vacation Stay">
            Vacation Stay
          </option>

          <option value="Other">
            Other
          </option>
        </select>


        <!-- PURPOSE -->

        <label class="field-label" for="purpose">
          Purpose
        </label>

        <select
          id="purpose"
          name="purpose"
          required
        >
          <option value="">
            Select purpose
          </option>

          <option value="Rent">
            Rent
          </option>

          <option value="Sale">
            Sale
          </option>

          <option value="Vacation">
            Vacation / Outing
          </option>
        </select>


        <!-- PROPERTY PRICE -->

        <label class="field-label" for="price">
          Property Price
        </label>

        <input
          id="price"
          name="price"
          type="number"
          min="0"
          placeholder="Enter property price"
          required
        >


        <!-- CURRENCY -->

        <label class="field-label" for="currency">
          Currency
        </label>

        <select
          id="currency"
          name="currency"
        >
          <option value="KES">
            KES - Kenyan Shilling
          </option>

          <option value="USD">
            USD - US Dollar
          </option>

          <option value="GBP">
            GBP - British Pound
          </option>

          <option value="EUR">
            EUR - Euro
          </option>
        </select>


        <!-- DESCRIPTION -->

        <label class="field-label" for="description">
          Description
        </label>

        <textarea
          id="description"
          name="description"
          placeholder="Describe the property..."
          required
        ></textarea>


        <!-- OWNER NAME -->

        <label class="field-label" for="ownerName">
          Your Name
        </label>

        <input
          id="ownerName"
          name="ownerName"
          type="text"
          placeholder="Your full name"
          required
        >


        <!-- EMAIL -->

        <label class="field-label" for="ownerEmail">
          Email
        </label>

        <input
          id="ownerEmail"
          name="ownerEmail"
          type="email"
          placeholder="your@email.com"
          required
        >


        <!-- PHONE -->

        <label class="field-label" for="ownerPhone">
          Phone Number
        </label>

        <input
          id="ownerPhone"
          name="ownerPhone"
          type="tel"
          placeholder="e.g. 0712345678"
          required
        >


        <!-- LISTING PLAN -->

        <label class="field-label">
          Choose Listing Plan
        </label>


        <div class="plans">

          <!-- FEATURED -->

          <button
            type="button"
            class="plan-button"
            data-plan="featured"
            data-amount="1000"
          >

            <strong>
              FEATURED
            </strong>

            <span>
              KES 1,000
            </span>

            <small>
              Promote your property with Featured visibility.
            </small>

            <div class="selected-label">
              ✓ FEATURED SELECTED
            </div>

          </button>


          <!-- PREMIUM -->

          <button
            type="button"
            class="plan-button"
            data-plan="premium"
            data-amount="2500"
          >

            <strong>
              PREMIUM
            </strong>

            <span>
              KES 2,500
            </span>

            <small>
              Give your property premium visibility.
            </small>

            <div class="selected-label">
              ✓ PREMIUM SELECTED
            </div>

          </button>

        </div>


        <!-- PAY -->

        <button
          id="payButton"
          class="pay-button"
          type="submit"
        >
          Continue to Paystack
        </button>


        <!-- ERROR / STATUS -->

        <div id="message"></div>

      </form>


      <a
        class="back"
        href="/"
      >
        ← Back to Global Estates
      </a>

    </div>

  </div>


  <script>

    /*
      SELECTED PAYMENT PLAN
    */

    let selectedPlan = null;
    let selectedAmount = 0;


    /*
      MAKE FEATURED AND PREMIUM PRESSABLE
    */

    document
      .querySelectorAll(".plan-button")
      .forEach(function(button) {

        button.addEventListener(
          "click",
          function() {

            /*
              Remove selection from
              both buttons.
            */

            document
              .querySelectorAll(".plan-button")
              .forEach(function(btn) {

                btn.classList.remove(
                  "selected"
                );

              });


            /*
              Select the button pressed.
            */

            this.classList.add(
              "selected"
            );


            /*
              Remember the plan.
            */

            selectedPlan =
              this.dataset.plan;


            selectedAmount =
              Number(
                this.dataset.amount
              );


            console.log(
              "Selected plan:",
              selectedPlan
            );

            console.log(
              "Selected amount:",
              selectedAmount
            );

          }
        );

      });


    /*
      FORM
    */

    const form =
      document.getElementById(
        "propertyForm"
      );


    const payButton =
      document.getElementById(
        "payButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    /*
      SHOW MESSAGE
    */

    function showMessage(text) {

      message.style.display =
        "block";

      message.classList.remove(
        "success-message"
      );

      message.textContent =
        text;

    }


    /*
      FORM SUBMIT
    */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        message.style.display =
          "none";


        /*
          MAKE SURE A PLAN WAS SELECTED.
        */

        if (!selectedPlan) {

          showMessage(
            "Please tap FEATURED or PREMIUM first."
          );

          return;

        }


        /*
          CHECK AMOUNT.
        */

        if (!selectedAmount) {

          showMessage(
            "The selected payment amount is invalid."
          );

          return;

        }


        /*
          GET EMAIL.
        */

        const email =
          document
            .getElementById(
              "ownerEmail"
            )
            .value
            .trim();


        if (!email) {

          showMessage(
            "Please enter your email address."
          );

          return;

        }


        /*
          COLLECT PROPERTY.
        */

        const property = {

          title:
            document
              .getElementById("title")
              .value
              .trim(),

          location:
            document
              .getElementById("location")
              .value
              .trim(),

          country:
            document
              .getElementById("country")
              .value
              .trim(),

          propertyType:
            document
              .getElementById("propertyType")
              .value,

          purpose:
            document
              .getElementById("purpose")
              .value,

          price:
            Number(
              document
                .getElementById("price")
                .value
            ),

          currency:
            document
              .getElementById("currency")
              .value,

          description:
            document
              .getElementById("description")
              .value
              .trim(),

          ownerName:
            document
              .getElementById("ownerName")
              .value
              .trim(),

          ownerEmail:
            email,

          ownerPhone:
            document
              .getElementById("ownerPhone")
              .value
              .trim(),

          plan:
            selectedPlan,

          listingFee:
            selectedAmount

        };


        try {

          /*
            DISABLE BUTTON.
          */

          payButton.disabled =
            true;

          payButton.textContent =
            "Connecting to Paystack...";


          /*
            TEMPORARILY SAVE PROPERTY
            IN THE BROWSER.
          */

          localStorage.setItem(
            "globalEstatesPendingProperty",
            JSON.stringify(
              property
            )
          );


          /*
            SEND PAYMENT REQUEST
            TO GLOBAL ESTATES SERVER.
          */

          const response =
            await fetch(
              "/api/paystack/initialize",
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({

                    email:
                      email,

                    amount:
                      selectedAmount,

                    metadata: {

                      type:
                        "property_listing",

                      plan:
                        selectedPlan,

                      propertyTitle:
                        property.title,

                      ownerEmail:
                        property.ownerEmail

                    }

                  })

              }
            );


          /*
            READ SERVER RESPONSE.
          */

          const data =
            await response.json();


          console.log(
            "Paystack response:",
            data
          );


          /*
            CHECK RESPONSE.
          */

          if (
            !response.ok ||
            !data.status ||
            !data.authorization_url
          ) {

            throw new Error(
              data.error ||
              data.message ||
              "Paystack could not start the payment."
            );

          }


          /*
            OPEN PAYSTACK.
          */

          window.location.href =
            data.authorization_url;


        }

        catch(error) {

          console.error(
            "Payment error:",
            error
          );


          showMessage(
            "Payment could not start: " +
            error.message
          );


          payButton.disabled =
            false;


          payButton.textContent =
            "Continue to Paystack";

        }

      });

  </script>

</body>
</html>
