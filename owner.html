<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>List Property | Global Estates</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07110d;
      color: #ffffff;
    }

    header {
      padding: 18px 20px;
      background: #0b1913;
      border-bottom: 1px solid #23452f;
    }

    .nav {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #ffffff;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #d6ad55;
    }

    .nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 15px;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: 35px auto;
    }

    .card {
      background: #0d1d15;
      border: 1px solid #254b32;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
    }

    h1 {
      margin-top: 0;
      color: #d6ad55;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #315d3e;
      background: #07110d;
      color: white;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
    }

    .plans {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }

    .plan {
      border: 2px solid #315d3e;
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
    }

    .plan:hover {
      border-color: #d6ad55;
    }

    .plan input {
      width: auto;
      margin-right: 8px;
    }

    .price {
      color: #d6ad55;
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #d6ad55;
      color: #07110d;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      padding: 14px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .success {
      display: block !important;
      background: #123b24;
      color: #a8f0bd;
    }

    .error {
      display: block !important;
      background: #4a1717;
      color: #ffb1b1;
    }

    @media (max-width: 650px) {
      .plans {
        grid-template-columns: 1fr;
      }

      .nav a {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <a href="/" class="logo">
      Global <span>Estates</span>
    </a>

    <div>
      <a href="/">Home</a>
      <a href="/properties.html">Properties</a>
    </div>
  </div>
</header>

<div class="container">

  <div class="card">

    <h1>List Your Property</h1>

    <p>
      Enter your property details and choose a listing plan.
    </p>

    <form id="propertyForm">

      <label for="title">Property title</label>
      <input
        id="title"
        type="text"
        placeholder="e.g. Modern 3 Bedroom House"
        required
      >

      <label for="location">Location</label>
      <input
        id="location"
        type="text"
        placeholder="e.g. Nairobi"
        required
      >

      <label for="country">Country</label>
      <input
        id="country"
        type="text"
        value="Kenya"
        required
      >

      <label for="propertyType">Property type</label>
      <select id="propertyType" required>
        <option value="">Select property type</option>
        <option value="House">House</option>
        <option value="Apartment">Apartment</option>
        <option value="Villa">Villa</option>
        <option value="Land">Land</option>
        <option value="Commercial">Commercial Property</option>
        <option value="Vacation">Vacation Stay</option>
        <option value="Outing">Outing</option>
      </select>

      <label for="purpose">Purpose</label>
      <select id="purpose" required>
        <option value="">Select purpose</option>
        <option value="Rent">For Rent</option>
        <option value="Sale">For Sale</option>
        <option value="Vacation">Vacation</option>
        <option value="Outing">Outing</option>
      </select>

      <label for="price">Property price</label>
      <input
        id="price"
        type="number"
        min="0"
        placeholder="Enter property price"
        required
      >

      <label for="currency">Currency</label>
      <select id="currency">
        <option value="KES">KES</option>
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
      </select>

      <label for="description">Description</label>
      <textarea
        id="description"
        rows="5"
        placeholder="Describe the property..."
        required
      ></textarea>

      <label for="ownerName">Owner name</label>
      <input
        id="ownerName"
        type="text"
        required
      >

      <label for="ownerEmail">Owner email</label>
      <input
        id="ownerEmail"
        type="email"
        placeholder="owner@example.com"
        required
      >

      <label for="ownerPhone">Phone / WhatsApp</label>
      <input
        id="ownerPhone"
        type="tel"
        placeholder="+254..."
        required
      >

      <h2>Choose Listing Plan</h2>

      <div class="plans">

        <label class="plan">
          <input
            type="radio"
            name="plan"
            value="Featured"
            data-amount="1000"
            required
          >

          <strong>Featured Listing</strong>

          <div class="price">
            KES 1,000
          </div>

          <p>
            Promote your property with a Featured listing.
          </p>
        </label>

        <label class="plan">
          <input
            type="radio"
            name="plan"
            value="Premium"
            data-amount="2500"
          >

          <strong>Premium Listing</strong>

          <div class="price">
            KES 2,500
          </div>

          <p>
            Give your property premium visibility.
          </p>
        </label>

      </div>

      <div id="message"></div>

      <button
        id="payButton"
        type="submit"
      >
        Continue to Paystack
      </button>

    </form>

  </div>

</div>

<script>
  const form =
    document.getElementById("propertyForm");

  const payButton =
    document.getElementById("payButton");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

  }


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      payButton.disabled = true;

      payButton.textContent =
        "Starting payment...";


      try {

        const selectedPlan =
          document.querySelector(
            'input[name="plan"]:checked'
          );


        if (!selectedPlan) {

          throw new Error(
            "Please select a listing plan."
          );

        }


        const amount =
          Number(
            selectedPlan.dataset.amount
          );


        const property = {

          title:
            document.getElementById(
              "title"
            ).value.trim(),

          location:
            document.getElementById(
              "location"
            ).value.trim(),

          country:
            document.getElementById(
              "country"
            ).value.trim(),

          propertyType:
            document.getElementById(
              "propertyType"
            ).value,

          purpose:
            document.getElementById(
              "purpose"
            ).value,

          price:
            document.getElementById(
              "price"
            ).value,

          currency:
            document.getElementById(
              "currency"
            ).value,

          description:
            document.getElementById(
              "description"
            ).value.trim(),

          ownerName:
            document.getElementById(
              "ownerName"
            ).value.trim(),

          ownerEmail:
            document.getElementById(
              "ownerEmail"
            ).value.trim(),

          ownerPhone:
            document.getElementById(
              "ownerPhone"
            ).value.trim(),

          plan:
            selectedPlan.value,

          listingFee:
            amount

        };


        /*
        ------------------------------------------------
        Save property locally while payment is processed
        ------------------------------------------------
        */

        localStorage.setItem(
          "globalEstatesPendingProperty",
          JSON.stringify(property)
        );


        showMessage(
          "Connecting to Paystack...",
          "success"
        );


        /*
        ------------------------------------------------
        Initialize Paystack payment
        ------------------------------------------------
        */

        const response =
          await fetch(
            "/api/paystack/initialize",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  email:
                    property.ownerEmail,

                  amount:
                    property.listingFee,

                  metadata: {

                    source:
                      "Global Estates",

                    plan:
                      property.plan,

                    propertyTitle:
                      property.title,

                    location:
                      property.location,

                    country:
                      property.country,

                    propertyType:
                      property.propertyType,

                    purpose:
                      property.purpose,

                    propertyPrice:
                      property.price,

                    currency:
                      property.currency,

                    ownerName:
                      property.ownerName,

                    ownerPhone:
                      property.ownerPhone

                  }

                })

            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.status
        ) {

          throw new Error(
            data.error ||
            "Paystack could not start the payment."
          );

        }


        if (
          !data.authorization_url
        ) {

          throw new Error(
            "Paystack did not return a payment link."
          );

        }


        showMessage(
          "Payment page ready. Opening Paystack...",
          "success"
        );


        payButton.textContent =
          "Opening Paystack...";


        /*
        ------------------------------------------------
        Open Paystack
        ------------------------------------------------
        */

        window.location.href =
          data.authorization_url;


      } catch(error) {

        console.error(
          "Global Estates payment error:",
          error
        );


        showMessage(
          "Payment failed: " +
          error.message,
          "error"
        );


        payButton.disabled = false;

        payButton.textContent =
          "Try Again";

      }

    }
  );
</script>

</body>
</html>
